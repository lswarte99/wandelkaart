<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Een kamer voor jezelf — Amsterdam</title>
  <meta name="theme-color" content="#b91c1c">

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body, #map { height: 100%; width: 100%; overflow: hidden; font-family: system-ui, -apple-system, sans-serif; }

    .gps-btn {
      position: fixed;
      bottom: 46px;
      right: 14px;
      z-index: 1000;
      width: 52px;
      height: 52px;
      background: #ffffff;
      color: #2c2c2c;
      border: none;
      border-radius: 50%;
      box-shadow: 0 3px 10px rgba(0, 0, 0, 0.25);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0;
      transition: transform 0.1s ease, color 0.2s ease;
    }
    .gps-btn:active { transform: scale(0.95); }
    .gps-btn.active { color: #2563eb; }

    .poi-marker {
      width: 28px;
      height: 28px;
      background: #ffffff;
      border: 2.5px solid #b91c1c;
      border-radius: 50%;
      color: #b91c1c;
      font-weight: 700;
      font-family: Georgia, serif;
      font-style: italic;
      font-size: 15px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 2px 5px rgba(0,0,0,0.3);
    }

    .leaflet-popup-content {
      max-width: 280px;
      max-height: 320px;
      overflow-y: auto;
      line-height: 1.45;
      font-size: 14px;
    }
    .leaflet-popup-content h3 {
      margin: 0 0 6px 0;
      color: #b91c1c;
      font-size: 16px;
    }
    .leaflet-popup-content p {
      margin: 0 0 8px 0;
    }

    .status-toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(31, 41, 55, 0.92);
      color: #fff;
      padding: 8px 16px;
      border-radius: 999px;
      font-size: 13px;
      z-index: 1000;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease;
    }
    .status-toast.show { opacity: 1; }
  </style>
</head>
<body>

  <div id="map"></div>

  <button id="gpsBtn" class="gps-btn" type="button" aria-label="Centreer op mijn locatie" title="Centreer op mijn locatie">
    <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="7"></circle>
      <circle cx="12" cy="12" r="2.5"></circle>
      <line x1="12" y1="2" x2="12" y2="5"></line>
      <line x1="12" y1="19" x2="12" y2="22"></line>
      <line x1="2" y1="12" x2="5" y2="12"></line>
      <line x1="19" y1="12" x2="22" y2="12"></line>
    </svg>
  </button>

  <div id="toast" class="status-toast">Locatie zoeken...</div>

  <script>
    const map = L.map('map').setView([52.363284, 4.891148], 13);

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '&copy; OpenStreetMap-bijdragers'
    }).addTo(map);

    function formatDescription(text) {
      if (!text) return '';
      return text
        .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
        .replace(/\*(.*?)\*/g, '<em>$1</em>')
        .split(/\n\s*\n/)
        .map(p => `<p>${p.replace(/\n/g, '<br>')}</p>`)
        .join('');
    }

    const poiIcon = L.divIcon({
      className: '',
      html: '<div class="poi-marker">i</div>',
      iconSize: [28, 28],
      iconAnchor: [14, 14],
      popupAnchor: [0, -14]
    });

    // Laad alle lagen rechtstreeks vanuit jouw uMap-kaart
    fetch('https://umap.openstreetmap.fr/nl/map/1481527/geojson/')
      .then(res => res.json())
      .then(data => {
        const layers = data.layers || [data];
        layers.forEach(layerData => {
          L.geoJSON(layerData, {
            style: () => ({
              color: '#b91c1c',
              weight: 5,
              opacity: 0.85
            }),
            pointToLayer: (feature, latlng) => L.marker(latlng, { icon: poiIcon }),
            onEachFeature: (feature, layer) => {
              const props = feature.properties || {};
              if (props.name || props.description) {
                const title = props.name ? `<h3>${props.name}</h3>` : '';
                const desc = formatDescription(props.description);
                layer.bindPopup(title + desc);
              }
            }
          }).addTo(map);
        });
      })
      .catch(() => showToast('Kon kaartgegevens niet laden.'));

    // Blauwe GPS-stip + live tracking
    const gpsBtn = document.getElementById('gpsBtn');
    const toast = document.getElementById('toast');
    let userMarker = null;
    let accuracyCircle = null;
    let watchId = null;
    let shouldCenter = false;

    function showToast(msg) {
      toast.textContent = msg;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 3000);
    }

    function updatePosition(pos) {
      const latlng = [pos.coords.latitude, pos.coords.longitude];
      const radius = pos.coords.accuracy;

      if (!userMarker) {
        accuracyCircle = L.circle(latlng, {
          radius: radius,
          color: '#2563eb',
          fillColor: '#3b82f6',
          fillOpacity: 0.15,
          weight: 1
        }).addTo(map);

        userMarker = L.circleMarker(latlng, {
          radius: 8,
          fillColor: '#2563eb',
          color: '#ffffff',
          weight: 2.5,
          opacity: 1,
          fillOpacity: 1
        }).addTo(map);
      } else {
        userMarker.setLatLng(latlng);
        accuracyCircle.setLatLng(latlng).setRadius(radius);
      }

      if (shouldCenter) {
        map.setView(latlng, Math.max(map.getZoom(), 16));
        shouldCenter = false;
      }
    }

    gpsBtn.addEventListener('click', () => {
      if (!('geolocation' in navigator)) {
        showToast('GPS wordt niet ondersteund op dit apparaat.');
        return;
      }
      shouldCenter = true;
      gpsBtn.classList.add('active');
      showToast('Locatie bepalen...');

      if (watchId === null) {
        watchId = navigator.geolocation.watchPosition(
          updatePosition,
          () => showToast('Kan locatie niet bepalen. Controleer GPS-toestemming.'),
          { enableHighAccuracy: true, maximumAge: 5000, timeout: 10000 }
        );
      } else if (userMarker) {
        map.setView(userMarker.getLatLng(), Math.max(map.getZoom(), 16));
        shouldCenter = false;
      }
    });
  </script>

</body>
</html>
