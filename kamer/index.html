<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Een kamer voor jezelf — Amsterdam</title>
  <meta name="theme-color" content="#b91c1c">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; width: 100%; overflow: hidden; font-family: system-ui, -apple-system, sans-serif; background: #f8fafc; }
    
    iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }

    .gps-btn {
      position: fixed;
      bottom: 46px;
      right: 14px;
      z-index: 1000;
      width: 52px;
      height: 52px;
      background: #ffffff;
      color: #2c2c2c;
      border: none;
      border-radius: 50%;
      box-shadow: 0 3px 10px rgba(0, 0, 0, 0.25);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0;
      transition: transform 0.1s ease, color 0.2s ease;
    }

    .gps-btn:active {
      transform: scale(0.95);
    }

    .gps-btn.active {
      color: #b91c1c;
    }

    .status-toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(31, 41, 55, 0.92);
      color: #fff;
      padding: 8px 16px;
      border-radius: 999px;
      font-size: 13px;
      z-index: 1000;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease;
    }
    .status-toast.show { opacity: 1; }
  </style>
</head>
<body>

  <button id="gpsBtn" class="gps-btn" type="button" aria-label="Centreer op mijn locatie" title="Centreer op mijn locatie">
    <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="7"></circle>
      <circle cx="12" cy="12" r="2.5"></circle>
      <line x1="12" y1="2" x2="12" y2="5"></line>
      <line x1="12" y1="19" x2="12" y2="22"></line>
      <line x1="2" y1="12" x2="5" y2="12"></line>
      <line x1="19" y1="12" x2="22" y2="12"></line>
    </svg>
  </button>

  <div id="toast" class="status-toast">Locatie zoeken...</div>

  <iframe 
    id="umapFrame"
    src="https://umap.openstreetmap.fr/nl/map/een-kamer-voor-jezelf_1481527?scaleControl=false&miniMap=false&scrollWheelZoom=true&zoomControl=true&editMode=disabled&moreControl=false&searchControl=false&tilelayersControl=false&embedControl=false&datalayersControl=true&onLoadPanel=none&captionBar=false&captionMenus=false#13/52.363284/4.891148"
    allowfullscreen
    allow="geolocation">
  </iframe>

  <script>
    const gpsBtn = document.getElementById('gpsBtn');
    const umapFrame = document.getElementById('umapFrame');
    const toast = document.getElementById('toast');
    const baseUrl = "https://umap.openstreetmap.fr/nl/map/een-kamer-voor-jezelf_1481527?scaleControl=false&miniMap=false&scrollWheelZoom=true&zoomControl=true&editMode=disabled&moreControl=false&searchControl=false&tilelayersControl=false&embedControl=false&datalayersControl=true&onLoadPanel=none&captionBar=false&captionMenus=false";

    function showToast(msg) {
      toast.textContent = msg;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 3000);
    }

    gpsBtn.addEventListener('click', () => {
      if (!('geolocation' in navigator)) {
        showToast('GPS wordt niet ondersteund op dit apparaat.');
        return;
      }
      showToast('Huidige positie ophalen...');
      navigator.geolocation.getCurrentPosition(
        (pos) => {
          const lat = pos.coords.latitude.toFixed(6);
          const lon = pos.coords.longitude.toFixed(6);
          umapFrame.src = `${baseUrl}#17/${lat}/${lon}`;
          gpsBtn.classList.add('active');
          showToast('Kaart gecentreerd op je locatie');
        },
        () => {
          showToast('Kan locatie niet bepalen. Controleer GPS-toestemming.');
        },
        { enableHighAccuracy: true, timeout: 10000 }
      );
    });
  </script>

</body>
</html>
