<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Camper Nav</title>

  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#0f172a" />

  <link rel="manifest" href="manifest.json?v=2" />
  <link rel="icon" type="image/png" sizes="512x512" href="../hub-icon.png" />
  <link rel="apple-touch-icon" href="../hub-icon.png" />

  <!-- MapLibre GL JS (3D Vectorkaart Engine) -->
  <link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet" />
  <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>

  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #e5e7eb;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    #map {
      width: 100%;
      height: 100%;
    }

    /* Bovenbalk: Zoeken (alleen in planstand) */
    .search-container {
      position: absolute;
      top: 14px;
      left: 14px;
      right: 14px;
      z-index: 1000;
      display: flex;
      flex-direction: column;
      gap: 8px;
      transition: opacity 0.25s ease, transform 0.25s ease;
    }

    body.navigating .search-container {
      opacity: 0;
      transform: translateY(-20px);
      pointer-events: none;
    }

    .search-box {
      display: flex;
      background: rgba(255, 255, 255, 0.96);
      border-radius: 14px;
      box-shadow: 0 3px 14px rgba(0, 0, 0, 0.16);
      border: 1px solid rgba(0, 0, 0, 0.1);
      overflow: hidden;
    }

    .search-box input {
      flex: 1;
      border: none;
      padding: 13px 16px;
      font-size: 16px;
      outline: none;
      background: transparent;
      color: #1e293b;
    }

    .search-box button {
      border: none;
      background: #0f172a;
      color: #ffffff;
      padding: 0 18px;
      font-weight: 600;
      font-size: 15px;
      cursor: pointer;
    }

    .search-results {
      background: #ffffff;
      border-radius: 14px;
      box-shadow: 0 6px 22px rgba(0, 0, 0, 0.2);
      max-height: 240px;
      overflow-y: auto;
      display: none;
    }

    .search-result-item {
      padding: 12px 16px;
      border-bottom: 1px solid #f1f5f9;
      font-size: 14px;
      color: #1e293b;
      cursor: pointer;
    }

    .search-result-item:last-child {
      border-bottom: none;
    }

    /* Afslagbalk bovenin (alleen zichtbaar tijdens rijden) */
    .turn-banner {
      position: absolute;
      top: 14px;
      left: 14px;
      right: 14px;
      z-index: 1002;
      background: #0f172a;
      color: #ffffff;
      border-radius: 16px;
      padding: 14px 18px;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.28);
      display: none;
      align-items: center;
      gap: 16px;
    }

    body.navigating .turn-banner {
      display: flex;
    }

    .turn-icon {
      font-size: 34px;
      line-height: 1;
      min-width: 40px;
      text-align: center;
    }

    .turn-info {
      flex: 1;
      overflow: hidden;
    }

    .turn-dist {
      font-size: 22px;
      font-weight: 800;
      letter-spacing: -0.3px;
    }

    .turn-street {
      font-size: 15px;
      color: #cbd5e1;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-top: 2px;
    }

    /* Rechter zijknoppen: Geluid, 2D/3D en GPS */
    .side-controls {
      position: absolute;
      right: 14px;
      bottom: 115px;
      z-index: 1000;
      display: flex;
      flex-direction: column;
      gap: 10px;
      transition: bottom 0.25s ease;
    }

    body.navigating .side-controls {
      bottom: 96px;
    }

    .ctrl-btn {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: #ffffff;
      border: 1.5px solid rgba(0, 0, 0, 0.15);
      box-shadow: 0 3px 10px rgba(0, 0, 0, 0.22);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 14px;
      color: #1e293b;
      cursor: pointer;
    }

    .ctrl-btn.active {
      background: #eff6ff;
      border-color: #2563eb;
      color: #2563eb;
    }

    /* Onderpaneel in Planstand (voor vertrek) */
    .plan-panel {
      position: absolute;
      bottom: 14px;
      left: 14px;
      right: 14px;
      z-index: 1001;
      background: #ffffff;
      border-radius: 16px;
      padding: 14px 16px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.22);
      display: none;
      flex-direction: column;
      gap: 12px;
    }

    body.navigating .plan-panel {
      display: none !important;
    }

    .plan-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }

    .plan-eta {
      font-size: 18px;
      font-weight: 700;
      color: #0f172a;
    }

    .close-btn {
      background: #f1f5f9;
      border: none;
      border-radius: 50%;
      width: 32px;
      height: 32px;
      font-size: 16px;
      font-weight: bold;
      color: #475569;
      cursor: pointer;
    }

    .plan-actions {
      display: flex;
      gap: 8px;
    }

    .mode-btn {
      flex: 1;
      padding: 11px;
      border-radius: 12px;
      border: 1.5px solid #cbd5e1;
      background: #ffffff;
      font-weight: 600;
      font-size: 14px;
      color: #334155;
      cursor: pointer;
    }

    .mode-btn.active {
      border-color: #0f172a;
      background: #f1f5f9;
      color: #0f172a;
    }

    .start-btn {
      flex: 1.4;
      padding: 11px 16px;
      border-radius: 12px;
      border: none;
      background: #16a34a;
      color: #ffffff;
      font-weight: 700;
      font-size: 15px;
      cursor: pointer;
    }

    /* Slanke Onderbalk tijdens het rijden (alleen Aankomsttijd + Stop) */
    .drive-bar {
      position: absolute;
      bottom: 14px;
      left: 14px;
      right: 14px;
      z-index: 1002;
      background: #ffffff;
      border-radius: 16px;
      padding: 12px 16px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.24);
      display: none;
      align-items: center;
      justify-content: space-between;
    }

    body.navigating .drive-bar {
      display: flex;
    }

    .eta-box {
      display: flex;
      flex-direction: column;
    }

    .eta-time {
      font-size: 24px;
      font-weight: 800;
      color: #0f172a;
      line-height: 1.1;
    }

    .eta-sub {
      font-size: 13px;
      color: #64748b;
      margin-top: 2px;
    }

    .stop-btn {
      background: #dc2626;
      color: #ffffff;
      border: none;
      border-radius: 12px;
      padding: 12px 22px;
      font-weight: 700;
      font-size: 15px;
      cursor: pointer;
    }

    /* Eigen GPS Pijl Marker */
    .gps-puck {
      width: 24px;
      height: 24px;
      background: #2563eb;
      border: 3px solid #ffffff;
      border-radius: 50%;
      box-shadow: 0 0 10px rgba(37, 99, 235, 0.7);
      position: relative;
    }
    .gps-puck::after {
      content: '';
      position: absolute;
      top: -9px;
      left: 50%;
      transform: translateX(-50%);
      border-left: 6px solid transparent;
      border-right: 6px solid transparent;
      border-bottom: 9px solid #2563eb;
    }

    /* Automatische Laadpaal Pins */
    .charger-pin {
      width: 26px;
      height: 26px;
      border-radius: 50%;
      background: #ffffff;
      border: 2px solid #16a34a;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.25);
      cursor: pointer;
    }
    .charger-pin.chademo {
      border-color: #0284c7;
      border-width: 2.5px;
    }

    .maplibregl-popup-content {
      border-radius: 12px;
      padding: 12px 14px;
      font-family: inherit;
      max-width: 240px;
    }
    .popup-route-btn {
      margin-top: 8px;
      width: 100%;
      padding: 8px;
      border: none;
      border-radius: 8px;
      background: #0284c7;
      color: #ffffff;
      font-weight: 600;
      font-size: 13px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div id="map"></div>

  <!-- Zoekbalk (verdwijnt automatisch tijdens rijden) -->
  <div class="search-container">
    <div class="search-box">
      <input type="text" id="searchInput" placeholder="Waar gaan we naartoe?" />
      <button id="searchBtn">Zoek</button>
    </div>
    <div id="searchResults" class="search-results"></div>
  </div>

  <!-- Afslagbalk bovenin tijdens het rijden -->
  <div id="turnBanner" class="turn-banner">
    <div id="turnIcon" class="turn-icon">⬆️</div>
    <div class="turn-info">
      <div id="turnDist" class="turn-dist">-- m</div>
      <div id="turnStreet" class="turn-street">Volg de route</div>
    </div>
  </div>

  <!-- Rechts: Geluid (Piepjes/Spraak/Stil), 2D/3D en GPS -->
  <div class="side-controls">
    <button id="audioBtn" class="ctrl-btn active" title="Geluid: Piepjes / Spraak / Stil">🔔</button>
    <button id="tiltBtn" class="ctrl-btn" title="Wissel 2D / 3D">3D</button>
    <button id="gpsBtn" class="ctrl-btn" title="Volg mijn locatie">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
        <circle cx="12" cy="12" r="7" />
        <line x1="12" y1="1" x2="12" y2="5" />
        <line x1="12" y1="19" x2="12" y2="23" />
        <line x1="1" y1="12" x2="5" y2="12" />
        <line x1="19" y1="12" x2="23" y2="12" />
      </svg>
    </button>
  </div>

  <!-- Onderpaneel vóór vertrek -->
  <div id="planPanel" class="plan-panel">
    <div class="plan-header">
      <div id="planEta" class="plan-eta">Aankomst berekenen...</div>
      <button id="closePlanBtn" class="close-btn" aria-label="Sluiten">✕</button>
    </div>
    <div class="plan-actions">
      <button id="modeCar" class="mode-btn active">🚐 Camper</button>
      <button id="modeWalk" class="mode-btn">🚶 Lopen</button>
      <button id="startNavBtn" class="start-btn">Start</button>
    </div>
  </div>

  <!-- Slanke balk tijdens rijden -->
  <div id="driveBar" class="drive-bar">
    <div class="eta-box">
      <div id="driveEtaTime" class="eta-time">--:--</div>
      <div id="driveEtaSub" class="eta-sub">Aankomsttijd</div>
    </div>
    <button id="stopNavBtn" class="stop-btn">Stop</button>
  </div>

  <script>
    // 1. Kaart initialiseren
    const map = new maplibregl.Map({
      container: 'map',
      style: 'https://tiles.openfreemap.org/styles/bright',
      center: [4.7625, 52.8935],
      zoom: 12,
      pitch: 0,
      bearing: 0
    });

    map.on('load', () => {
      const layers = map.getStyle().layers;
      let labelLayerId;
      for (let i = 0; i < layers.length; i++) {
        if (layers[i].type === 'symbol' && layers[i].layout['text-field']) {
          labelLayerId = layers[i].id;
          break;
        }
      }

      if (map.getSource('openmaptiles')) {
        map.addLayer({
          'id': '3d-buildings',
          'source': 'openmaptiles',
          'source-layer': 'building',
          'type': 'fill-extrusion',
          'minzoom': 14,
          'paint': {
            'fill-extrusion-color': '#cbd5e1',
            'fill-extrusion-height': ['get', 'render_height'],
            'fill-extrusion-base': ['get', 'render_min_height'],
            'fill-extrusion-opacity': 0.75
          }
        }, labelLayerId);
      }

      // Laadpalen direct eenmalig ophalen voor het startgebied
      fetchChargersSilently();
    });

    // Staatvariabelen
    let userCoords = null;
    let userMarker = null;
    let destCoords = null;
    let destMarker = null;
    let travelMode = 'driving';
    let isNavigating = false;
    let followGps = false;
    let watchId = null;
    let wakeLock = null;
    let routeSteps = [];
    let lastRecalcTime = 0;

    // 2. Audio-engine (1-2-3 piepjes via Web Audio API + optioneel spraak)
    let audioMode = 'beeps'; // 'beeps' | 'voice' | 'mute'
    const audioBtn = document.getElementById('audioBtn');
    let audioCtx = null;

    function initAudio() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
    }

    function playBeeps(count) {
      if (audioMode !== 'beeps') return;
      initAudio();
      const now = audioCtx.currentTime;
      for (let i = 0; i < count; i++) {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(count === 3 ? 880 : 660, now + i * 0.22);
        gain.gain.setValueAtTime(0.25, now + i * 0.22);
        gain.gain.exponentialRampToValueAtTime(0.001, now + i * 0.22 + 0.14);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(now + i * 0.22);
        osc.stop(now + i * 0.22 + 0.15);
      }
    }

    function speakText(text) {
      if (audioMode !== 'voice' || !('speechSynthesis' in window)) return;
      window.speechSynthesis.cancel();
      const utter = new SpeechSynthesisUtterance(text);
      utter.lang = 'nl-NL';
      window.speechSynthesis.speak(utter);
    }

    audioBtn.addEventListener('click', () => {
      initAudio();
      if (audioMode === 'beeps') {
        audioMode = 'voice';
        audioBtn.textContent = '🗣️';
        audioBtn.classList.add('active');
        speakText('Spraakbegeleiding aan');
      } else if (audioMode === 'voice') {
        audioMode = 'mute';
        audioBtn.textContent = '🔇';
        audioBtn.classList.remove('active');
      } else {
        audioMode = 'beeps';
        audioBtn.textContent = '🔔';
        audioBtn.classList.add('active');
        playBeeps(1);
      }
    });

    // 3. 2D / 3D Schakelaar
    const tiltBtn = document.getElementById('tiltBtn');
    let is3D = false;

    function set3DMode(enable) {
      is3D = enable;
      tiltBtn.classList.toggle('active', is3D);
      tiltBtn.textContent = is3D ? '2D' : '3D';
      map.easeTo({ pitch: is3D ? 60 : 0, duration: 600 });
    }

    tiltBtn.addEventListener('click', () => set3DMode(!is3D));

    // 4. Afstandsberekening (Haversine in meters)
    function distanceMeters(c1, c2) {
      const R = 6371000;
      const toRad = d => d * Math.PI / 180;
      const dLat = toRad(c2[1] - c1[1]);
      const dLon = toRad(c2[0] - c1[0]);
      const a = Math.sin(dLat / 2) ** 2 +
                Math.cos(toRad(c1[1])) * Math.cos(toRad(c2[1])) * Math.sin(dLon / 2) ** 2;
      return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
    }

    // 5. GPS Tracking & Live Afslag/ETA update
    const gpsBtn = document.getElementById('gpsBtn');

    async function requestWakeLock() {
      try {
        if ('wakeLock' in navigator) {
          wakeLock = await navigator.wakeLock.request('screen');
        }
      } catch (e) {}
    }

    function updateUserPosition(pos) {
      const lng = pos.coords.longitude;
      const lat = pos.coords.latitude;
      const heading = pos.coords.heading;
      userCoords = [lng, lat];

      if (!userMarker) {
        const el = document.createElement('div');
        el.className = 'gps-puck';
        userMarker = new maplibregl.Marker({ element: el, rotationAlignment: 'map' })
          .setLngLat(userCoords)
          .addTo(map);
      } else {
        userMarker.setLngLat(userCoords);
      }

      if (heading !== null && !isNaN(heading)) {
        userMarker.setRotation(heading);
      }

      if (followGps || isNavigating) {
        const camOptions = {
          center: userCoords,
          duration: 800
        };
        if (isNavigating) {
          camOptions.zoom = travelMode === 'driving' ? 16.5 : 17.5;
          camOptions.pitch = 60;
          camOptions.padding = { top: 80, bottom: 200, left: 0, right: 0 };
          if (heading !== null && !isNaN(heading)) {
            camOptions.bearing = heading;
          }
        } else {
          camOptions.padding = { top: 0, bottom: 0, left: 0, right: 0 };
        }
        map.easeTo(camOptions);
      }

      if (isNavigating && destCoords) {
        checkUpcomingManeuver();
        // Elke 20 seconden route & aankomsttijd live verversen
        if (Date.now() - lastRecalcTime > 20000) {
          calculateRoute(true);
        }
      }
    }

    function startTracking(centerNow = true) {
      followGps = true;
      gpsBtn.classList.add('active');

      if (watchId === null) {
        watchId = navigator.geolocation.watchPosition(
          (pos) => {
            updateUserPosition(pos);
            if (centerNow) {
              map.flyTo({ center: [pos.coords.longitude, pos.coords.latitude], zoom: 15 });
              centerNow = false;
            }
          },
          () => {},
          { enableHighAccuracy: true, maximumAge: 1000, timeout: 10000 }
        );
      } else if (userCoords && centerNow) {
        map.flyTo({ center: userCoords, zoom: 15 });
      }
    }

    gpsBtn.addEventListener('click', () => {
      if (followGps && !isNavigating) {
        followGps = false;
        gpsBtn.classList.remove('active');
      } else {
        startTracking(true);
      }
    });

    map.on('dragstart', () => {
      if (!isNavigating) {
        followGps = false;
        gpsBtn.classList.remove('active');
      }
    });

    if ('geolocation' in navigator) {
      navigator.geolocation.getCurrentPosition((pos) => {
        updateUserPosition(pos);
        map.jumpTo({ center: [pos.coords.longitude, pos.coords.latitude], zoom: 13 });
      }, () => {}, { enableHighAccuracy: true });
    }

    // 6. Automatisch & geruisloos laadpalen op de kaart tonen
    let chargerMarkers = [];
    let lastChargerFetchCenter = null;

    async function fetchChargersSilently() {
      const zoom = map.getZoom();
      if (zoom < 11.5) return; // Alleen laden als je voldoende bent ingezoomd

      const center = map.getCenter();
      if (lastChargerFetchCenter && distanceMeters([center.lng, center.lat], lastChargerFetchCenter) < 4000) {
        return; // Kaart is nauwelijks verschoven
      }
      lastChargerFetchCenter = [center.lng, center.lat];

      const south = (center.lat - 0.09).toFixed(4);
      const west = (center.lng - 0.14).toFixed(4);
      const north = (center.lat + 0.09).toFixed(4);
      const east = (center.lng + 0.14).toFixed(4);
      const bbox = `${south},${west},${north},${east}`;

      const query = `[out:json][timeout:12];(node["amenity"="charging_station"](${bbox});way["amenity"="charging_station"](${bbox}););out center 100;`;

      try {
        const res = await fetch('https://overpass-api.de/api/interpreter', {
          method: 'POST',
          body: 'data=' + encodeURIComponent(query)
        });
        if (!res.ok) return;
        const data = await res.json();

        chargerMarkers.forEach(m => m.remove());
        chargerMarkers = [];

        data.elements.forEach(el => {
          const lat = el.lat || (el.center && el.center.lat);
          const lon = el.lon || (el.center && el.center.lon);
          if (!lat || !lon) return;

          const tags = el.tags || {};
          const hasChademo = Boolean(tags['socket:chademo']);
          const name = tags.name || tags.operator || (hasChademo ? 'CHAdeMO Snellader' : 'Laadpaal');

          const pin = document.createElement('div');
          pin.className = hasChademo ? 'charger-pin chademo' : 'charger-pin';
          pin.textContent = hasChademo ? '⚡' : '🔌';

          const popupHtml = `
            <strong>${name}</strong><br>
            <small>${hasChademo ? 'CHAdeMO snellader' : 'Reguliere laadpaal'}</small>
            <button class="popup-route-btn" onclick="selectDestination(${lon}, ${lat})">
              Route hierheen
            </button>
          `;

          const popup = new maplibregl.Popup({ offset: 14 }).setHTML(popupHtml);
          const marker = new maplibregl.Marker({ element: pin })
            .setLngLat([lon, lat])
            .setPopup(popup)
            .addTo(map);

          chargerMarkers.push(marker);
        });
      } catch (e) {
        // Geruisloos negeren als Overpass even druk is — geen irritante pop-ups
      }
    }

    map.on('moveend', fetchChargersSilently);

    // 7. Zoekbalk (Nominatim OpenStreetMap)
    const searchInput = document.getElementById('searchInput');
    const searchBtn = document.getElementById('searchBtn');
    const searchResults = document.getElementById('searchResults');

    async function performSearch() {
      const q = searchInput.value.trim();
      if (!q) return;
      searchResults.style.display = 'block';
      searchResults.innerHTML = '<div class="search-result-item">Zoeken...</div>';

      try {
        const url = `https://nominatim.openstreetmap.org/search?format=json&limit=5&countrycodes=nl,be,de&q=${encodeURIComponent(q)}`;
        const res = await fetch(url);
        const items = await res.json();

        if (!items.length) {
          searchResults.innerHTML = '<div class="search-result-item">Niets gevonden</div>';
          return;
        }

        searchResults.innerHTML = '';
        items.forEach(item => {
          const div = document.createElement('div');
          div.className = 'search-result-item';
          div.textContent = item.display_name;
          div.addEventListener('click', () => {
            searchResults.style.display = 'none';
            searchInput.blur();
            selectDestination(parseFloat(item.lon), parseFloat(item.lat));
          });
          searchResults.appendChild(div);
        });
      } catch (e) {
        searchResults.innerHTML = '<div class="search-result-item">Zoekfout</div>';
      }
    }

    searchBtn.addEventListener('click', performSearch);
    searchInput.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') performSearch();
    });

    // 8. Routeberekening (OSRM met stappen) & Live Aankomsttijd
    const planPanel = document.getElementById('planPanel');
    const planEta = document.getElementById('planEta');
    const driveEtaTime = document.getElementById('driveEtaTime');
    const driveEtaSub = document.getElementById('driveEtaSub');
    const modeCarBtn = document.getElementById('modeCar');
    const modeWalkBtn = document.getElementById('modeWalk');

    function formatArrival(durationSeconds) {
      const arrival = new Date(Date.now() + durationSeconds * 1000);
      const hh = String(arrival.getHours()).padStart(2, '0');
      const mm = String(arrival.getMinutes()).padStart(2, '0');
      const mins = Math.max(1, Math.round(durationSeconds / 60));
      return { clock: `${hh}:${mm}`, mins };
    }

    window.selectDestination = function(lng, lat) {
      document.querySelectorAll('.maplibregl-popup').forEach(p => p.remove());
      destCoords = [lng, lat];
      planPanel.style.display = 'flex';
      planEta.textContent = 'Aankomst berekenen...';

      if (destMarker) destMarker.remove();
      destMarker = new maplibregl.Marker({ color: '#dc2626' })
        .setLngLat(destCoords)
        .addTo(map);

      calculateRoute(false);
    };

    async function calculateRoute(isSilentUpdate = false) {
      if (!destCoords) return;
      lastRecalcTime = Date.now();

      const start = userCoords || [map.getCenter().lng, map.getCenter().lat];
      const profile = travelMode === 'driving' ? 'car' : 'foot';

      try {
        const url = `https://router.project-osrm.org/route/v1/${profile}/${start[0]},${start[1]};${destCoords[0]},${destCoords[1]}?overview=full&geometries=geojson&steps=true`;
        const res = await fetch(url);
        const data = await res.json();

        if (!data.routes || !data.routes.length) return;

        const route = data.routes[0];
        const eta = formatArrival(route.duration);

        planEta.textContent = `Aankomst ${eta.clock} (${eta.mins} min)`;
        driveEtaTime.textContent = eta.clock;
        driveEtaSub.textContent = `Nog ${eta.mins} min`;

        // Afslagstappen opslaan met bewaakte waarschuwingsstatus
        if (route.legs && route.legs[0] && route.legs[0].steps) {
          routeSteps = route.legs[0].steps.map(s => ({
            location: s.maneuver.location,
            type: s.maneuver.type,
            modifier: s.maneuver.modifier || '',
            name: s.name || '',
            warnedFar: false,
            warnedMid: false,
            warnedNow: false
          }));
          checkUpcomingManeuver();
        }

        const geojson = { type: 'Feature', geometry: route.geometry };

        if (map.getSource('route')) {
          map.getSource('route').setData(geojson);
        } else {
          map.addSource('route', { type: 'geojson', data: geojson });
          map.addLayer({
            id: 'route-line',
            type: 'line',
            source: 'route',
            layout: { 'line-join': 'round', 'line-cap': 'round' },
            paint: {
              'line-color': travelMode === 'driving' ? '#0284c7' : '#d97706',
              'line-width': 6,
              'line-opacity': 0.88
            }
          });
        }

        map.setPaintProperty('route-line', 'line-color', travelMode === 'driving' ? '#0284c7' : '#d97706');

        if (!isNavigating && !isSilentUpdate) {
          const bounds = new maplibregl.LngLatBounds(start, start).extend(destCoords);
          map.fitBounds(bounds, { padding: { top: 90, bottom: 160, left: 40, right: 40 }, pitch: 0 });
        }
      } catch (e) {}
    }

    // 9. Afslagpijl & 1-2-3 piepjes controle
    const turnIcon = document.getElementById('turnIcon');
    const turnDist = document.getElementById('turnDist');
    const turnStreet = document.getElementById('turnStreet');

    function getManeuverInfo(step) {
      const m = step.modifier;
      if (step.type === 'arrive') return { icon: '🏁', text: 'Bestemming bereikt' };
      if (step.type === 'roundabout' || step.type === 'rotary') return { icon: '🔄', text: 'Rotonde' };
      if (m.includes('left')) return { icon: '↰', text: 'Linksaf' };
      if (m.includes('right')) return { icon: '↱', text: 'Rechtsaf' };
      return { icon: '⬆️', text: 'Rechtdoor' };
    }

    function checkUpcomingManeuver() {
      if (!userCoords || routeSteps.length < 2) return;

      // Stap 0 is vertrekpunt; stap 1 is de eerstvolgende echte afslag
      const nextStep = routeSteps[1];
      const dist = Math.round(distanceMeters(userCoords, nextStep.location));
      const info = getManeuverInfo(nextStep);

      turnIcon.textContent = info.icon;
      turnDist.textContent = dist >= 1000 ? `${(dist / 1000).toFixed(1)} km` : `${dist} m`;
      turnStreet.textContent = nextStep.name ? `${info.text} • ${nextStep.name}` : info.text;

      if (!isNavigating) return;

      // 1-2-3 piepjes (en optionele spraak) op basis van afstand
      if (dist <= 35 && !nextStep.warnedNow) {
        nextStep.warnedNow = true;
        playBeeps(3);
        speakText(`Nu ${info.text.toLowerCase()}`);
      } else if (dist <= 110 && dist > 35 && !nextStep.warnedMid) {
        nextStep.warnedMid = true;
        playBeeps(2);
        speakText(`Over 100 meter ${info.text.toLowerCase()}`);
      } else if (dist <= 300 && dist > 110 && !nextStep.warnedFar) {
        nextStep.warnedFar = true;
        playBeeps(1);
      }

      // Als we heel dicht bij de afslag waren en weer verder weg raken, nieuwe route ophalen voor de volgende stap
      if (nextStep.warnedNow && dist > 55) {
        calculateRoute(true);
      }
    }

    // 10. Bedieningsknoppen
    modeCarBtn.addEventListener('click', () => {
      travelMode = 'driving';
      modeCarBtn.classList.add('active');
      modeWalkBtn.classList.remove('active');
      calculateRoute(false);
    });

    modeWalkBtn.addEventListener('click', () => {
      travelMode = 'foot';
      modeWalkBtn.classList.add('active');
      modeCarBtn.classList.remove('active');
      calculateRoute(false);
    });

    document.getElementById('startNavBtn').addEventListener('click', () => {
      initAudio(); // Activeer geluid door deze directe tik van de gebruiker
      isNavigating = true;
      document.body.classList.add('navigating');
      set3DMode(true);
      requestWakeLock();
      startTracking(true);
      playBeeps(1);
    });

    document.getElementById('stopNavBtn').addEventListener('click', () => {
      isNavigating = false;
      document.body.classList.remove('navigating');
      set3DMode(false);
      if (wakeLock) { wakeLock.release(); wakeLock = null; }
      map.easeTo({ padding: { top: 0, bottom: 0, left: 0, right: 0 } });
    });

    document.getElementById('closePlanBtn').addEventListener('click', () => {
      isNavigating = false;
      document.body.classList.remove('navigating');
      planPanel.style.display = 'none';
      if (destMarker) { destMarker.remove(); destMarker = null; }
      if (map.getLayer('route-line')) map.removeLayer('route-line');
      if (map.getSource('route')) map.removeSource('route');
      destCoords = null;
      routeSteps = [];
      set3DMode(false);
    });
  </script>
</body>
</html>
