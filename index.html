<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Trekvogelpad</title>

  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#7c3aed" />

  <link rel="manifest" href="manifest.json" />
  <link rel="icon" type="image/png" sizes="192x192" href="icon.png" />
  <link rel="apple-touch-icon" href="icon.png" />

  <style>
    * {
      box-sizing: border-box;
    }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #f2efe9;
      font-family: sans-serif;
    }

    #umap-frame {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }

    /* Minimalistische vizier-knop */
    .gps-btn {
      position: absolute;
      bottom: 24px;
      right: 18px;
      width: 48px;
      height: 48px;
      background-color: #ffffff;
      border: 2px solid rgba(0, 0, 0, 0.15);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 3px 8px rgba(0, 0, 0, 0.25);
      cursor: pointer;
      z-index: 9999;
      outline: none;
      transition: background-color 0.2s, border-color 0.2s;
      -webkit-tap-highlight-color: transparent;
    }

    .gps-btn svg {
      width: 26px;
      height: 26px;
      fill: #444444;
      transition: fill 0.2s;
    }

    /* Actieve satelliet-status */
    .gps-btn.active {
      background-color: #f5f3ff;
      border-color: #7c3aed;
    }

    .gps-btn.active svg {
      fill: #7c3aed;
    }

    /* Subtiele statusindicator voor fix */
    .gps-btn.searching svg {
      opacity: 0.4;
      animation: pulse 1.2s infinite ease-in-out;
    }

    @keyframes pulse {
      0% { transform: scale(0.9); opacity: 0.3; }
      50% { transform: scale(1.08); opacity: 0.8; }
      100% { transform: scale(0.9); opacity: 0.3; }
    }
  </style>
</head>
<body>

  <!-- uMap iframe: locateControl uitgeschakeld om dubbele knoppen te voorkomen -->
  <iframe 
    id="umap-frame" 
    src="https://umap.openstreetmap.fr/nl/map/vanlife_1370754?scaleControl=false&miniMap=false&scrollWheelZoom=true&locateControl=false" 
    allow="geolocation">
  </iframe>

  <!-- Minimalistische vizierknop -->
  <button id="gpsBtn" class="gps-btn" title="Volg GPS-locatie" aria-label="Volg GPS-locatie">
    <svg viewBox="0 0 24 24">
      <path d="M12 2a1 1 0 0 1 1 1v1.055A8.002 8.002 0 0 1 19.945 11H21a1 1 0 1 1 0 2h-1.055A8.002 8.002 0 0 1 13 19.945V21a1 1 0 1 1-2 0v-1.055A8.002 8.002 0 0 1 4.055 13H3a1 1 0 1 1 0-2h1.055A8.002 8.002 0 0 1 11 4.055V3a1 1 0 0 1 1-1zm0 4a6 6 0 1 0 0 12 6 6 0 0 0 0-12zm0 3a3 3 0 1 1 0 6 3 3 0 0 1 0-6z"/>
    </svg>
  </button>

  <script>
    const iframe = document.getElementById('umap-frame');
    const btn = document.getElementById('gpsBtn');
    let watchId = null;
    let currentZoom = 15;

    btn.addEventListener('click', () => {
      if (watchId !== null) {
        // Uitschakelen
        navigator.geolocation.clearWatch(watchId);
        watchId = null;
        btn.classList.remove('active', 'searching');
      } else {
        // Inschakelen met maximale satelliet-precisie
        btn.classList.add('searching');

        watchId = navigator.geolocation.watchPosition(
          (pos) => {
            btn.classList.remove('searching');
            btn.classList.add('active');

            const lat = pos.coords.latitude.toFixed(5);
            const lng = pos.coords.longitude.toFixed(5);

            // Centreer de kaart in de uMap-iframe zonder herladen
            iframe.contentWindow.location.replace(
              `https://umap.openstreetmap.fr/nl/map/vanlife_1370754?scaleControl=false&miniMap=false&scrollWheelZoom=true&locateControl=false#${currentZoom}/${lat}/${lng}`
            );
          },
          (err) => {
            btn.classList.remove('searching', 'active');
            alert('Geen satelliet-GPS fix kunnen krijgen: ' + err.message);
            navigator.geolocation.clearWatch(watchId);
            watchId = null;
          },
          {
            enableHighAccuracy: true, // Dwingt fysieke GPS-satellietchip af
            timeout: 12000,
            maximumAge: 0
          }
        );
      }
    });
  </script>
</body>
</html>
