<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Hanzestedenpad</title>

  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#7c3aed" />

  <link rel="manifest" href="manifest.json?v=7" />
  <link rel="icon" type="image/png" sizes="192x192" href="icon.png" />
  <link rel="apple-touch-icon" href="icon.png" />

  <style>
    * {
      box-sizing: border-box;
    }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #f2efe9;
      font-family: sans-serif;
    }

    #umap-frame {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }

    /* Vaste GPS-stip midden op het scherm */
    #user-marker {
      display: none;
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 22px;
      height: 22px;
      pointer-events: none;
      z-index: 9998;
    }

    #user-marker .dot {
      width: 14px;
      height: 14px;
      background-color: #2563eb;
      border: 2.5px solid #ffffff;
      border-radius: 50%;
      position: absolute;
      top: 4px;
      left: 4px;
      box-shadow: 0 0 6px rgba(0, 0, 0, 0.4);
    }

    #user-marker .ring {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background-color: rgba(37, 99, 235, 0.25);
      animation: pulse-ring 2s infinite ease-out;
    }

    @keyframes pulse-ring {
      0% { transform: scale(0.7); opacity: 0.8; }
      100% { transform: scale(1.6); opacity: 0; }
    }

    /* Minimalistische vizier-knop */
    .gps-btn {
      position: absolute;
      bottom: 24px;
      right: 18px;
      width: 48px;
      height: 48px;
      background-color: #ffffff;
      border: 2px solid rgba(0, 0, 0, 0.15);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 3px 8px rgba(0, 0, 0, 0.25);
      cursor: pointer;
      z-index: 9999;
      outline: none;
      transition: background-color 0.2s, border-color 0.2s;
      -webkit-tap-highlight-color: transparent;
    }

    .gps-btn svg {
      width: 26px;
      height: 26px;
      fill: #444444;
      transition: fill 0.2s;
    }

    .gps-btn.active {
      background-color: #f5f3ff;
      border-color: #7c3aed;
    }

    .gps-btn.active svg {
      fill: #7c3aed;
    }

    .gps-btn.searching svg {
      opacity: 0.4;
      animation: pulse 1.2s infinite ease-in-out;
    }

    @keyframes pulse {
      0% { transform: scale(0.9); opacity: 0.3; }
      50% { transform: scale(1.08); opacity: 0.8; }
      100% { transform: scale(0.9); opacity: 0.3; }
    }
  </style>
</head>
<body>

  <!-- uMap iframe -->
  <iframe 
    id="umap-frame" 
    src="https://umap.openstreetmap.fr/nl/map/hanzenstedenpad_1481330?scaleControl=false&miniMap=false&scrollWheelZoom=true&locateControl=false&zoomControl=false&fullscreenControl=false&shareControl=false&moreControl=false&locale=nl" 
    allow="geolocation *; autoplay; encrypted-media">
  </iframe>

  <!-- Visuele GPS-indicator (blauwe stip) -->
  <div id="user-marker">
    <div class="ring"></div>
    <div class="dot"></div>
  </div>

  <!-- Symmetrische vizierknop (4 pootjes) -->
  <button id="gpsBtn" class="gps-btn" title="Volg GPS-locatie" aria-label="Volg GPS-locatie">
    <svg viewBox="0 0 24 24">
      <path d="M12 2a1 1 0 0 1 1 1v1.055A8.002 8.002 0 0 1 19.945 11H21a1 1 0 1 1 0 2h-1.055A8.002 8.002 0 0 1 13 19.945V21a1 1 0 1 1-2 0v-1.055A8.002 8.002 0 0 1 11 4.055V3a1 1 0 0 1 1-1zm0 4a6 6 0 1 0 0 12 6 6 0 0 0 0-12zm-8 7a1 1 0 1 1 0-2h1.055A8.002 8.002 0 0 0 11 19.945V21a1 1 0 0 1-2 0v-1.055A8.002 8.002 0 0 1 4.055 13zm8-4a3 3 0 1 1 0 6 3 3 0 0 1 0-6z"/>
    </svg>
  </button>

  <script>
    const iframe = document.getElementById('umap-frame');
    const btn = document.getElementById('gpsBtn');
    const marker = document.getElementById('user-marker');
    const baseParams = "scaleControl=false&miniMap=false&scrollWheelZoom=true&locateControl=false&zoomControl=false&fullscreenControl=false&shareControl=false&moreControl=false&locale=nl";
    let watchId = null;

    function updateMapPosition(lat, lng) {
      // Dwing het iframe opnieuw te navigeren naar de exacte GPS-coördinaten
      iframe.src = `https://umap.openstreetmap.fr/nl/map/hanzenstedenpad_1481330#15/${lat}/${lng}?${baseParams}&_t=${Date.now()}`;
    }

    btn.addEventListener('click', () => {
      if (watchId !== null) {
        navigator.geolocation.clearWatch(watchId);
        watchId = null;
        btn.classList.remove('active', 'searching');
        marker.style.display = 'none';
      } else {
        btn.classList.add('searching');

        navigator.geolocation.getCurrentPosition(
          (pos) => {
            btn.classList.remove('searching');
            btn.classList.add('active');
            marker.style.display = 'block';

            const lat = pos.coords.latitude.toFixed(5);
            const lng = pos.coords.longitude.toFixed(5);
            updateMapPosition(lat, lng);
          },
          (err) => {
            btn.classList.remove('searching', 'active');
            marker.style.display = 'none';
            alert('Geen satelliet-GPS fix: ' + err.message);
          },
          {
            enableHighAccuracy: true,
            timeout: 10000,
            maximumAge: 0
          }
        );

        watchId = navigator.geolocation.watchPosition(
          (pos) => {
            btn.classList.add('active');
            marker.style.display = 'block';
          },
          null,
          { enableHighAccuracy: true }
        );
      }
    });
  </script>
</body>
</html>
